# 所有相对路径均相对本 ini 文件所在目录。
[checkerboard]
square_mm = 15.0
cols = 35
rows = 28
border_mm = 15.0
paper_w_mm = 555.0
paper_h_mm = 450.0
out_dir = assets/checkerboard

[calibrate]
input_dir = assets/test_data/calibration
out_xml = assets/calibration/checkerboard_calib.xml
# 输出像素宽高与标定输入相同；该刻度只改变物理覆盖范围和 px→mm 系数。
target_mm_per_px = 0.136
qa_dir = temp/calibration_qa
# 内角点和实测格距缺省跟随 [checkerboard]；仅在确有需要或卡尺实测后显式添加对应键。

[debug]
# 缺键也按 false；true 时输出标定 QA 图。
save_intermediate = false
