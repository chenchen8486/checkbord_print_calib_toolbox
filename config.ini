# 所有相对路径均相对本 ini 文件所在目录。
[checkerboard]
square_mm = 15.0 ; 单格边长（毫米），决定打印后的物理尺寸
cols = 35 ; 横向格数（列数）
rows = 28 ; 纵向格数（行数）
border_mm = 15.0 ; 棋盘四周留白边距（毫米），防止角点提取受纸边干扰
paper_w_mm = 555.0 ; 纸张宽度（毫米），与硬件放置面板尺寸绑定并略微内缩，确保纸张放置留有余量
paper_h_mm = 450.0 ; 纸张高度（毫米），尺寸约束同上
out_dir = assets/checkerboard ; 标定板图像输出目录（相对 ini 目录）

[calibrate]
input_dir = assets/test_data/calibration ; 标定采图目录（相对 ini 目录，多张时自动取角点均值降噪）
out_xml = assets/calibration/checkerboard_calib.xml ; 标定结果输出文件（相对 ini 目录）
target_mm_per_px = 0.136 ; 输出像素宽高与标定输入相同；该刻度只改变物理覆盖范围和 px→mm 系数。
qa_dir = temp/calibration_qa ; 标定质量检查图像输出目录（相对 ini 目录）
# 内角点和实测格距缺省跟随 [checkerboard]；仅在确有需要或卡尺实测后显式添加对应键。

[debug]
save_intermediate = false ; 缺键也按 false；true 时输出标定 QA 图。
